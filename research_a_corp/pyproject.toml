[project]
name = "research_a_corp"
version = "0.1.0"
description = "research_a_corp using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.4"
]

[project.scripts]
research_a_corp = "research_a_corp.main:run"
run_crew = "research_a_corp.main:run"
train = "research_a_corp.main:train"
replay = "research_a_corp.main:replay"
test = "research_a_corp.main:test"
run_with_trigger = "research_a_corp.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
