[project]
name = "resume_uploader"
version = "0.1.0"
description = "resume_uploader using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.4"
]

[project.scripts]
resume_uploader = "resume_uploader.main:run"
run_crew = "resume_uploader.main:run"
train = "resume_uploader.main:train"
replay = "resume_uploader.main:replay"
test = "resume_uploader.main:test"
run_with_trigger = "resume_uploader.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
